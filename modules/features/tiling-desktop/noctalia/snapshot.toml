# Generated by noctalia-snapshot-preferences; review before committing.
[audio]
enable_overdrive = true

[bar.default]
smart_auto_hide = true

[control_center]
width = 750

[hooks]
colors_changed = [
    "/nix/store/jds7a6mp42np1g9ch07ma5dq4m3ml74l-noctalia-snapshot-preferences",
]
logging_out = [
    "/nix/store/jds7a6mp42np1g9ch07ma5dq4m3ml74l-noctalia-snapshot-preferences",
]
rebooting = [
    "/nix/store/jds7a6mp42np1g9ch07ma5dq4m3ml74l-noctalia-snapshot-preferences",
]
shutting_down = [
    "/nix/store/jds7a6mp42np1g9ch07ma5dq4m3ml74l-noctalia-snapshot-preferences",
]

[idle]
behavior_order = [
    "lock",
    "screen-off",
    "lock-and-suspend",
]

[idle.behavior.lock]
action = "lock"
enabled = false
timeout = 600.0

[idle.behavior.lock-and-suspend]
action = "lock_and_suspend"
enabled = true
timeout = 7200.0

[idle.behavior.screen-off]
action = "screen_off"
enabled = true
timeout = 660.0

[location]
auto_locate = true

[notification]
background_opacity = 0.7999999821186066
follow_focused_output = true
history_retention_hours = 2
max_visible = 3

[osd]
background_opacity = 0.7999999821186066

[shell]
external_ip_enabled = true
launch_apps_as_systemd_services = true
polkit_agent = true
telemetry_enabled = false
umbriel_overview_type_to_launch_enabled = true

[shell.greeter_sync]
auto_sync = true

[shell.launcher.providers.emoji]
global = false

[shell.panel]
control_center_placement = "floating"
open_near_click_control_center = true
transparency_mode = "soft"

[theme]
builtin = "Catppuccin"
community_palette = "Oxocarbon"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-rainbow"

[theme.templates]
builtin_ids = [
    "gtk3",
    "gtk4",
    "ghostty",
    "kcolorscheme",
    "umbriel",
]

[wallpaper]
default = "/nix/store/p0illsi0f7cmvxv07x38ldkwb28clcsy-NixOS_Black.png?raw=true"
