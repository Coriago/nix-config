[layout]
mode = "scrolling"

[layout.scrolling]
default_extent_fraction = 0.6666666666666666

# Upstream examples/config.toml bindings. Application launchers live in umbriel.nix.
[keybinds]
# Applications and session
"Mod+X" = { action = "window-close", repeat = false }
"Mod+Escape" = "session-quit"
"Mod+Shift+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }
"Mod+C" = "cheatsheet-toggle"

# Focus and movement
"Mod+H" = "window-focus-left"
"Mod+J" = "window-focus-down"
"Mod+K" = "window-focus-up"
"Mod+L" = "window-focus-right"

# Monitor focus (left, down, up, right)
"Mod+Ctrl+H" = "output-focus-left"
"Mod+Ctrl+J" = "output-focus-down"
"Mod+Ctrl+K" = "output-focus-up"
"Mod+Ctrl+L" = "output-focus-right"

# Move the focused workspace's contents to an empty workspace on that monitor.
# Directional output actions do not wrap; disable repeat to avoid chained moves.
"Mod+Shift+H" = { action = "workspace-move-to-output-left", repeat = false }
"Mod+Shift+J" = { action = "workspace-move-to-output-down", repeat = false }
"Mod+Shift+K" = { action = "workspace-move-to-output-up", repeat = false }
"Mod+Shift+L" = { action = "workspace-move-to-output-right", repeat = false }

# Window state and layout
"Mod+M" = { action = "window-toggle-maximize-to-edges", repeat = false }
"Mod+F" = { action = "window-toggle-fullscreen", repeat = false }
"Mod+WheelUp" = "window-focus-left"
"Mod+WheelDown" = "window-focus-right"
"Mod+O" = { action = "overview-toggle", repeat = false }

# Workspaces
"Mod+Q" = "workspace-switch:1"
"Mod+W" = "workspace-switch:2"
"Mod+E" = "workspace-switch:3"
"Mod+R" = "workspace-switch:4"
"Mod+T" = "workspace-switch:5"

# Scratchpad
# "Mod+Shift+Space" = { action = "window-move-to-scratchpad", repeat = false }
# "Mod+Space" = "scratchpad-toggle"
# "Mod+Ctrl+Space" = { action = "window-restore-from-scratchpad", repeat = false }
# "Mod+Tab" = "scratchpad-focus-next"
