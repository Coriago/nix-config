[package]
name = "sync-snap"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Materialize writable configuration and capture filtered preference snapshots"

[dependencies]
anyhow = "1.0"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
tempfile = "3.23"
toml = "0.8.23"

[profile.release]
lto = "thin"
strip = true
